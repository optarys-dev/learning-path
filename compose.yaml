services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env con un valor no vacio}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env con un valor no vacio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con un valor no vacio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Define POSTGRES_PORT en .env con un valor no vacio}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  embeddings:
    build:
      context: ./backend/embedding-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB:?Define POSTGRES_DB en .env con un valor no vacio} user=${POSTGRES_USER:?Define POSTGRES_USER en .env con un valor no vacio}"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con un valor no vacio}
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: 8765
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Define EMBEDDING_MODEL en .env con un valor no vacio}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:?Define EMBEDDING_REVISION en .env con un valor no vacio}
      EMBEDDING_DEVICE: cpu
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).close()"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 20
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Define ConnectionStrings__DefaultConnection en .env con un valor no vacio}
      DatabaseInitialization__Enabled: 'true'
      DatabaseInitialization__SeedDirectory: /seeds
      EmbeddingService__Url: ${EMBEDDING_SERVICE_URL:?Define EMBEDDING_SERVICE_URL en .env con un valor no vacio}
      Discord__DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Define DISCORD_CLIENT_ID en .env con un valor no vacio}
      Discord__DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Define DISCORD_CLIENT_SECRET en .env con un valor no vacio}
      Discord__DISCORD_CALLBACK_PATH: ${DISCORD_CALLBACK_PATH:?Define DISCORD_CALLBACK_PATH en .env con un valor no vacio}
      Discord__DISCORD_FORCE_HTTPS_CALLBACK: ${DISCORD_FORCE_HTTPS_CALLBACK:-false}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Groq__ApiKey: ${Groq__ApiKey:?Define Groq__ApiKey en .env con un valor no vacio}
      Groq__Model: ${Groq__Model:?Define Groq__Model en .env con un valor no vacio}
    ports:
      - "8080:8080"
    volumes:
      - ./database/seeds:/seeds:ro
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache:
