services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codequest2026}
      POSTGRES_USER: ${POSTGRES_USER:-codequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  embeddings:
    build:
      context: ./backend/embedding-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB:-codequest2026} user=${POSTGRES_USER:-codequest}"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: 8765
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-main}
      EMBEDDING_DEVICE: cpu
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).close()"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-codequest2026};Username=${POSTGRES_USER:-codequest};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      EmbeddingService__Url: http://embeddings:8765/
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache:
